  <circle cx="120" cy="130" r="22" fill="url(#sBhOut)"></circle>
  <circle cx="120" cy="130" r="13" fill="url(#sBhCore)"></circle>
  <circle cx="120" cy="130" r="13" fill="none" stroke="rgba(255,255,255,.22)" stroke-width="1"></circle>
  <circle cx="120" cy="130" r="4.5" fill="#D090FF"></circle>
  <circle cx="120" cy="130" r="2" fill="#FFFFFF"></circle>
